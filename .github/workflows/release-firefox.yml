name: Release (Firefox)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($MANIFEST_VERSION)."
            echo "Bump package.json and wxt.config.ts before tagging."
            exit 1
          fi

      - name: Typecheck
        run: bun run compile

      - name: Build & zip (Firefox)
        run: bun run zip:firefox

      - name: Submit to AMO
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun run wxt submit \
            --firefox-zip ".output/toolzzz-${VERSION}-firefox.zip" \
            --firefox-sources-zip ".output/toolzzz-${VERSION}-sources.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            .output/toolzzz-*-firefox.zip
            .output/toolzzz-*-sources.zip
