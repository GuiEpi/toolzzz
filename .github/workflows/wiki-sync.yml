name: Sync wiki

on:
  push:
    branches: [master]
    paths:
      - "wiki/**"
      - "assets/wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone wiki repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-remote

      - name: Mirror wiki content
        run: |
          find wiki-remote -maxdepth 1 -name '*.md' -delete
          rm -rf wiki-remote/assets
          cp wiki/*.md wiki-remote/
          mkdir -p wiki-remote/assets/wiki
          cp assets/wiki/* wiki-remote/assets/wiki/

      - name: Commit and push
        working-directory: wiki-remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No wiki changes to publish."
            exit 0
          fi
          git commit -m "sync from ${{ github.repository }}@${{ github.sha }}"
          git push
