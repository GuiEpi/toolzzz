name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WXT >= 0.21 exige Node 22 : `bun run wxt` lance le bin `wxt` sous Node
      # (shebang), pas sous Bun. Les runners GitHub sont encore en Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run compile

      # Build Chrome + exécution du bundle dans jsdom : vérifie que les 18
      # bibliothèques vendorisées s'exposent comme avant (jQuery, DataTables,
      # Highcharts, moment…) et que main() démarre sans ReferenceError.
      - name: Vendor bundle smoke test
        run: bun run test:vendor

      # Bascule de persistance (Phase 4) : import des données 3.x, isolation
      # par serveur, pas de ré-import à la deuxième ouverture.
      - name: Storage migration test
        run: node scripts/test-storage.mjs
